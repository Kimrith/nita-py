<!-- Sidebar Navigation Component -->
<aside id="sidebar" class="fixed lg:static inset-y-0 left-0 z-40 w-64 bg-slate-900 border-r border-slate-800 flex flex-col justify-between shrink-0 glass-panel h-screen overflow-y-auto transform -translate-x-full lg:translate-x-0 transition-transform duration-300 ease-in-out">
  <div>
    <!-- Brand Logo -->
    <div class="h-16 flex items-center justify-between px-6 border-b border-slate-800 shrink-0">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-blue-600 to-indigo-500 flex items-center justify-center text-white font-bold text-xl shadow-lg shadow-blue-500/25 shrink-0">
          S
        </div>
        <div>
          <h1 class="font-bold text-base tracking-wide text-white leading-tight">SV7 Store</h1>
          <p class="text-xs text-slate-400 font-medium">Control Center</p>
        </div>
      </div>
      <button type="button" onclick="toggleAdminSidebar()" class="lg:hidden text-slate-400 hover:text-white p-1" title="Close Sidebar">✕</button>
    </div>

    <!-- Main Navigation Links -->
    <nav class="p-4 space-y-1.5">
      <div class="px-3 py-2 text-xs font-semibold text-slate-400 uppercase tracking-wider">Main Menu</div>
      
      <!-- Dashboard Tab Link -->
      <a href="{{ url_for('admin.admin_dashboard') }}" class="flex items-center gap-3 px-3.5 py-2.5 rounded-lg text-sm font-medium {% if active_page == 'dashboard' %}active-nav-link text-blue-400{% else %}text-slate-400 hover:text-white hover:bg-slate-800/60{% endif %} transition-all">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"/></svg>
        <span>Overview Dashboard</span>
      </a>

      <!-- Products Tab Link -->
      <a href="{{ url_for('admin.admin_products') }}" class="flex items-center gap-3 px-3.5 py-2.5 rounded-lg text-sm font-medium {% if active_page == 'product' %}active-nav-link text-blue-400{% else %}text-slate-400 hover:text-white hover:bg-slate-800/60{% endif %} transition-all">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/></svg>
        <span>Product Catalog</span>
      </a>

      <!-- Categories Tab Link -->
      <a href="{{ url_for('admin.admin_categories') }}" class="flex items-center gap-3 px-3.5 py-2.5 rounded-lg text-sm font-medium {% if active_page == 'category' %}active-nav-link text-blue-400{% else %}text-slate-400 hover:text-white hover:bg-slate-800/60{% endif %} transition-all">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A1.994 1.994 0 013 12V7a4 4 0 014-4z"/></svg>
        <span>Categories</span>
      </a>

      <!-- Users Tab Link -->
      <a href="{{ url_for('admin.admin_users') }}" class="flex items-center gap-3 px-3.5 py-2.5 rounded-lg text-sm font-medium {% if active_page == 'user' %}active-nav-link text-blue-400{% else %}text-slate-400 hover:text-white hover:bg-slate-800/60{% endif %} transition-all">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
        <span>User Management</span>
      </a>

      <div class="px-3 pt-6 py-2 text-xs font-semibold text-slate-400 uppercase tracking-wider">Quick Actions</div>
      <a href="{{ url_for('user.home') }}" target="_blank" class="flex items-center gap-3 px-3.5 py-2 rounded-lg text-sm text-slate-400 hover:text-white hover:bg-slate-800/40">
        <svg class="w-5 h-5 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/></svg>
        <span>View Live Store</span>
      </a>
    </nav>
  </div>

  <!-- Footer User Profile Badge -->
  <div class="p-4 border-t border-slate-800">
    <div class="flex items-center justify-between p-2 rounded-xl bg-slate-800/60 hover:bg-slate-800/90 transition group/user">
      <a href="{% if current_user.id %}{{ url_for('admin.admin_user_edit', user_id=current_user.id) }}{% else %}#{% endif %}" class="flex items-center gap-3 overflow-hidden flex-1 min-w-0" title="Edit Profile">
        {% if current_user.image %}
        <img src="{{ current_user.image }}" alt="{{ current_user.fullname }}" class="w-10 h-10 rounded-full object-cover border border-slate-700 shadow shrink-0">
        {% else %}
        <div class="w-10 h-10 rounded-full bg-gradient-to-tr from-violet-500 to-indigo-500 flex items-center justify-center font-bold text-white shadow shrink-0 text-xs">
          {{ current_user.avatar or 'CN' }}
        </div>
        {% endif %}
        <div class="overflow-hidden min-w-0">
          <h4 class="text-sm font-semibold text-white truncate group-hover/user:text-blue-400 transition">{{ current_user.fullname }}</h4>
          <p class="text-xs text-slate-400 truncate">{{ current_user.role }}</p>
        </div>
      </a>
      <a href="{{ url_for('admin.admin_logout') }}" title="Sign Out" class="p-2 rounded-lg text-slate-400 hover:text-red-400 hover:bg-slate-700/60 transition shrink-0 ml-1">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
        </svg>
      </a>
    </div>
  </div>
</aside>
