{% extends "front/base.html" %}

{% block content %}
  <section class="container section checkout-grid">
    <form class="form-panel" method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="eyebrow">Checkout</div>
      <h2>Customer information</h2>
      <label class="field">
        Full Name
        <input name="name" required>
      </label>
      <label class="field">
        Phone Number
        <input name="phone" required>
      </label>
      <label class="field">
        Email Address
        <input type="email" name="email" required>
      </label>
      <label class="field">
        Shipping Address
        <textarea name="address" rows="5" required></textarea>
      </label>
      <label class="field">
        Order Notes
        <textarea name="notes" rows="3"></textarea>
      </label>
      <button type="submit">Send order</button>
    </form>

    <div class="form-panel">
      <div class="eyebrow">Order summary</div>
      <h2>${{ "%.2f"|format(total) }}</h2>
      {% for item in items %}
        <p>{{ item.quantity }} x {{ item.product.title }} = ${{ "%.2f"|format(item.subtotal) }}</p>
      {% else %}
        <p>Your cart is empty.</p>
      {% endfor %}
    </div>
  </section>
{% endblock %}
