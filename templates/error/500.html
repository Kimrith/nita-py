<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950 text-slate-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>500 - Server Error | SV7 Store</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
          animation: {
            'blob-slow': 'blob 10s infinite',
            'blob-delayed': 'blob 10s infinite 3s',
            'pulse-rose': 'pulseRose 2.5s ease-in-out infinite',
          },
          keyframes: {
            blob: {
              '0%, 100%': { transform: 'translate(0px, 0px) scale(1)' },
              '33%': { transform: 'translate(30px, -40px) scale(1.1)' },
              '66%': { transform: 'translate(-20px, 20px) scale(0.95)' },
            },
            pulseRose: {
              '0%, 100%': { opacity: '0.4' },
              '50%': { opacity: '0.8' },
            }
          }
        }
      }
    }
  </script>

  <!-- Google Fonts Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    .glass-error-card {
      background: rgba(15, 23, 42, 0.78);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(244, 63, 94, 0.15);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8), 0 0 40px -5px rgba(244, 63, 94, 0.2);
    }
    .bg-grid-pattern {
      background-size: 40px 40px;
      background-image: 
        linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
    }
  </style>
</head>
<body class="h-full antialiased font-sans flex items-center justify-center min-h-screen relative overflow-hidden bg-slate-950">

  <!-- Ambient Glowing Orbs -->
  <div class="fixed inset-0 pointer-events-none overflow-hidden z-0">
    <div class="absolute -top-40 -left-40 w-96 h-96 bg-rose-600/20 rounded-full blur-3xl filter animate-blob-slow"></div>
    <div class="absolute top-1/3 -right-32 w-96 h-96 bg-violet-600/20 rounded-full blur-3xl filter animate-blob-delayed"></div>
    <div class="absolute -bottom-40 left-1/3 w-96 h-96 bg-red-600/20 rounded-full blur-3xl filter animate-blob-slow"></div>
    <div class="absolute inset-0 bg-grid-pattern opacity-60"></div>
  </div>

  <!-- Main Error Wrapper -->
  <div class="relative z-10 w-full max-w-lg px-6 py-12 text-center">
    
    <div class="glass-error-card rounded-3xl p-8 sm:p-10 relative">
      
      <!-- Big Glowing 500 Badge -->
      <div class="relative inline-flex items-center justify-center mb-6">
        <span class="text-8xl sm:text-9xl font-black tracking-tighter text-transparent bg-clip-text bg-gradient-to-r from-rose-400 via-violet-400 to-red-400 drop-shadow-lg">
          500
        </span>
        <div class="absolute -top-3 -right-3 w-10 h-10 rounded-2xl bg-rose-500/20 border border-rose-400/30 flex items-center justify-center text-rose-400 shadow-lg animate-pulse-rose">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
          </svg>
        </div>
      </div>

      <!-- Heading & Description -->
      <h1 class="text-2xl sm:text-3xl font-extrabold text-white tracking-tight mb-3">
        Internal Server Error
      </h1>
      <p class="text-xs sm:text-sm text-slate-400 max-w-md mx-auto leading-relaxed mb-8">
        Something went wrong on our end. Our engineering team has been notified and is working to resolve the issue.
      </p>

      <!-- Action Buttons -->
      <div class="flex flex-col sm:flex-row items-center justify-center gap-3">
        <button onclick="location.reload()" class="w-full sm:w-auto px-6 py-3 rounded-xl bg-gradient-to-r from-rose-600 via-violet-600 to-rose-500 hover:from-rose-500 hover:to-violet-500 text-white font-semibold text-xs shadow-lg shadow-rose-500/25 hover:shadow-rose-500/40 transition-all flex items-center justify-center gap-2 group">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
          </svg>
          <span>Reload Page</span>
        </button>

        <a href="{{ url_for('user.home') }}" class="w-full sm:w-auto px-6 py-3 rounded-xl bg-slate-800/80 border border-slate-700 hover:bg-slate-700 text-slate-300 hover:text-white font-semibold text-xs transition-all flex items-center justify-center gap-2">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
          </svg>
          <span>Return to Homepage</span>
        </a>
      </div>

    </div>

    <!-- Footer Security Note -->
    <p class="text-xs text-slate-500 mt-6 flex items-center justify-center gap-2">
      <span>SV7 System Status</span>
      <span>•</span>
      <button onclick="history.back()" class="text-slate-400 hover:text-white underline transition">Go Back</button>
    </p>

  </div>

</body>
</html>
